<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <title>FoodMart Header</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        .top-header {
            background: #f5f5f5;
            padding: 20px 0;
        }



        .search-box {
            background: #fff;
            border-radius: 40px;
            padding: 5px 15px;
            display: flex;
            align-items: center;
        }

        .search-box input {
            border: none;
            outline: none;
            width: 100%;
        }

        .icon-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 10px;
            cursor: pointer;
        }

        .cart-price {
            font-weight: 700;
            font-size: 18px;
        }

        img {
            height: 35px;
        }
    </style>
</head>

<body>

    <header class="top-header">
        <div class="container">
            <div class="row align-items-center">

                <!-- Logo -->
                <div class="col-lg-3 d-flex align-items-center">
                    <img src="/image/logo.png" class="me-2">

                </div>

                <!-- Search -->
                <div class="col-lg-5">
                    <div class="search-box">
                        <select class="form-select border-0 w-auto me-2">

                            <option>All Categories</option>
                            <option>groceries</option>
                            <option>Drink</option>
                            <option>chocolates</option>
                        </select>
                        <input type="text" placeholder="Search for more than 20,000 products">
                        <i class="bi bi-search ms-2"></i>
                    </div>
                </div>

                <!-- Right Section -->
                <div class="col-lg-4 d-flex align-items-center justify-content-end">

                    <div class="me-3 text-end">
                        <small class="text-muted">For Support?</small><br>
                        <strong>+980-34984089</strong>
                    </div>

                    <div class="icon-circle">
                        <i class="bi bi-person"></i>
                    </div>

                    <div class="icon-circle">
                        <i class="bi bi-heart"></i>
                    </div>

                    <div class="ms-3 text-end">
                        <small>Your Cart</small><br>
                        <span class="cart-price">$1290.00</span>
                    </div>

                </div>

            </div>
        </div>
    </header>
    <nav class="navbar navbar-expand-lg bg-white">
        <div class="container-fluid d-flex justify-content-center justify-content-lg-between">

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <select class="form-select border-0 w-auto bg-transparent">
                        <option>Shop by Departments</option>
                    </select>

                    <li class="nav-item"><a class="nav-link" href="#">Women</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Men</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Kids</a></li>

                </ul>

                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#">Brand</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Sale</a></li>
                </ul>

            </div>

        </div>
    </nav>


    <div id="fruitSlider" class="carousel slide" data-bs-ride="carousel">

        <!-- indicators (gole) -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#fruitSlider" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#fruitSlider" data-bs-slide-to="1"></button>
        </div>

        <div class="carousel-inner">

            <!-- Slide 1 -->
            <div class="carousel-item active">
                <img src="/image/background-pattern.jpg" alt="" class="img-fluid">

                <div class="carousel-caption custom-caption">
                    <p class="text-success fw-bold">100% Natural</p>
                    <h1 class="fw-bold">Fresh Smoothie & <br> Summer Juice</h1>
                    <p>Lorem ipsum dolor sit amet consectetur</p>
                    <button class="btn btn-success">Shop Collection</button>
                </div>
            </div>

            <!-- Slide 2 -->
            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1502741338009-cac2772e18bc" class="d-block w-100">

                <div class="carousel-caption custom-caption">
                    <p class="text-success fw-bold">Healthy Drink</p>
                    <h1 class="fw-bold">Organic Fruit Juice</h1>
                    <p>Fresh and natural fruits</p>
                    <button class="btn btn-success">Shop Now</button>
                </div>
            </div>

        </div>

    </div>


    <div id="carouselExampleIndicators" class="carousel slide">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
                aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="..." class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="..." class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="..." class="d-block w-100" alt="...">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
            data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    <i class="fa-solid fa-shield-check"></i>
    <i class="fa-brands fa-facebook-f"></i>
</body>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>

</html>
